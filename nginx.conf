server {
    # 8080 is the port for the unprivileged image and the healthcheck. 80 and 3000 are
    # kept for the Coolify "Ports Exposes" setting; as a non-root user, binding 80 relies
    # on Docker's default net.ipv4.ip_unprivileged_port_start=0 (Docker Engine >= 20.10).
    listen 80;
    listen 3000;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    # Security headers
    include /etc/nginx/snippets/security-headers.conf;

    # ES modules (pdf.js worker): the default mime.types has no .mjs entry, so browsers
    # would reject them as application/octet-stream. Not content-hashed, so revalidate.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Long-term caching for static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|avif|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
