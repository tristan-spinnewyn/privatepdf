# Shared security headers. Included in the server block and in every location that sets
# its own add_header, because nginx does not inherit add_header into such locations.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# TLS is terminated by the Coolify proxy; browsers only honour HSTS on HTTPS responses.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The app never needs these browser features.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Everything is processed in the browser, so no external origin is ever needed.
# 'wasm-unsafe-eval': pdf.js wasm decoders. 'unsafe-eval': heic2any's libheif (Emscripten embind)
# builds functions with new Function() in its blob: worker, which inherits this policy.
# blob:/data:: rendered pages, signatures, downloads, pdf.js fonts and the confetti/heic2any workers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
