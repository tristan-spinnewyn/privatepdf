name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: privatepdf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name privatepdf -p 8080:3000 privatepdf:ci

          # Wait for the Dockerfile HEALTHCHECK to report healthy
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' privatepdf)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "Container health: $status"
          [ "$status" = "healthy" ] || { docker logs privatepdf; exit 1; }

          headers=$(curl -fsSI http://localhost:8080/)
          echo "$headers" | grep -qi '^content-security-policy:' || { echo "Missing CSP header"; exit 1; }

          # The worker file name is content-hashed by Vite
          worker_path=$(docker exec privatepdf sh -c 'cd /usr/share/nginx/html && ls assets/pdf.worker.min-*.mjs')
          [ -n "$worker_path" ] || { echo "pdf.js worker missing from the image"; exit 1; }
          worker_type=$(curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:8080/$worker_path")
          echo "pdf.js worker /$worker_path Content-Type: $worker_type"
          [ "$worker_type" = "application/javascript" ] || exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs privatepdf || true
