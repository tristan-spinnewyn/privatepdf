version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for every minor and patch bump; majors stay separate
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Typings follow the Node runtime used in Docker and CI (see the docker entry below)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Node majors are upgraded deliberately: Node 25+ no longer ships corepack, used by the Dockerfile
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Odd nginx minors are the mainline branch; stay on the stable one (bump stable lines by hand)
      - dependency-name: "nginxinc/nginx-unprivileged"
        update-types: ["version-update:semver-minor"]
