services:
  privatepdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privatepdf
    restart: unless-stopped
    ports:
      - "8080:3000"
    # nginx only reads its config and the static files; it writes its pid and temp files to /tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
